<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Top repos</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: 40px auto;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { margin-bottom: 16px; }
    input, button {
      padding: 8px 10px;
      margin: 4px 4px 12px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
    }
    button { background: #2563eb; color: white; border: 0; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0 24px; }
    th, td { border-bottom: 1px solid #334155; text-align: left; padding: 8px; }
    pre {
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>GitHub activity</h1>

  <div id="login-box">
    <p>Log in to see the busiest repos from this hour.</p>
    <input id="username" placeholder="username" />
    <input id="password" type="password" placeholder="password" />
    <button id="login-btn">Log in</button>
    <p id="login-error"></p>
  </div>

  <div id="app" style="display:none">
    <h2>Top repos</h2>
    <button id="load">Load repos</button>
    <table>
      <thead>
        <tr><th>Repo</th><th>Events</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <h2>Ask</h2>
    <p>Try: top repos, top actors, or how many events.</p>
    <input id="question" placeholder="top repos" />
    <button id="ask">Ask</button>
    <pre id="answer"></pre>
  </div>

  <script>
    let token = "";

    document.getElementById("login-btn").onclick = function () {
      fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      })
        .then((r) => r.json())
        .then((login) => {
          if (!login.token) {
            document.getElementById("login-error").textContent = "Wrong username or password.";
            return;
          }
          token = login.token;
          document.getElementById("login-box").style.display = "none";
          document.getElementById("app").style.display = "block";
        });
    };

    document.getElementById("load").onclick = function () {
      fetch("/repos/top", {
        headers: { Authorization: "Bearer " + token },
      })
        .then((r) => r.json())
        .then((data) => {
          const tbody = document.getElementById("rows");
          tbody.innerHTML = "";
          for (const item of data) {
            const tr = document.createElement("tr");
            tr.innerHTML =
              "<td>" + item.repo_name + "</td><td>" + item.event_count + "</td>";
            tbody.appendChild(tr);
          }
        });
    };

    document.getElementById("ask").onclick = function () {
      fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
        body: JSON.stringify({
          question: document.getElementById("question").value,
        }),
      })
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("answer").textContent = JSON.stringify(data, null, 2);
        });
    };
  </script>
</body>
</html>
