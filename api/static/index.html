<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Top repos</title>
</head>
<body>
  <h1>Top repos</h1>
  <input id="username" placeholder="username" />
<input id="password" type="password" placeholder="password" />
<button id="load">Load repos</button>
  <table border="1">
    <thead>
      <tr><th>Repo</th><th>Events</th></tr>
    </thead>
    <tbody id="rows"></tbody>

  
  </table>

  <input id="question" placeholder="question" />
  <button id="ask">Ask</button>
  <pre id="answer"></pre>

  <script>
 document.getElementById("load").onclick = function () {
  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    }),
  })
    .then((r) => r.json())
    .then((login) => {
      return fetch("/repos/top", {
        headers: { Authorization: "Bearer " + login.token },
      });
    })
    .then((r) => r.json())
    .then((data) => {
      const tbody = document.getElementById("rows");
      tbody.innerHTML = ""; 
      for (const item of data) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + item.repo_name + "</td><td>" + item.event_count + "</td>";
        tbody.appendChild(tr);
      }
    });
};


document.getElementById("ask").onclick = function () {
  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    }),
  })
    .then((r) => r.json())
    .then((login) => {
      return fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + login.token,
        },
        body: JSON.stringify({
          question: document.getElementById("question").value,
        }),
      });
    })
    .then((r) => r.json())
    .then((data) => {
      document.getElementById("answer").textContent = JSON.stringify(data, null, 2);
    });
};

  </script>
</body>
</html>
