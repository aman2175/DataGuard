<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Top repos</title>
</head>
<body>
  <h1>Top repos</h1>
  <table border="1">
    <thead>
      <tr><th>Repo</th><th>Events</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    fetch("/repos/top")
      .then((r) => r.json())
      .then((data) => {
        const tbody = document.getElementById("rows");
        for (const item of data) {
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + item.repo_name + "</td><td>" + item.event_count + "</td>";
          tbody.appendChild(tr);
        }
      });
  </script>
</body>
</html>
