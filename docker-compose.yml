services:
  postgres:
    image: "postgres:16-alpine"
    container_name: ghdata-postgres
    environment:
      POSTGRES_USER: ghdata
      POSTGRES_PASSWORD: ghdata
      POSTGRES_DB: ghdata
    ports:
      - "5434:5432"
    volumes:
      - ghdata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghdata -d ghdata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ghdata_pg_data:
