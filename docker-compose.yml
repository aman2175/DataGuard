services:
  postgres:
    image: "postgres:16-alpine"
    container_name: ghdata-postgres
    environment:
      POSTGRES_USER: ghdata
      POSTGRES_PASSWORD: ghdata
      POSTGRES_DB: ghdata
    ports:
      - "5434:5432"
    volumes:
      - ghdata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghdata -d ghdata"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    container_name: ghdata-pgweb
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://ghdata:ghdata@postgres:5432/ghdata?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy


  api:
    build: .
    container_name: ghdata-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ghdata:ghdata@postgres:5432/ghdata
    depends_on:
      postgres:
        condition: service_healthy



volumes:
  ghdata_pg_data:
