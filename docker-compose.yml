services:
  postgres:
    image: "postgres:16-alpine"
    container_name: dataguard-postgres
    environment:
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: dataguard
      POSTGRES_DB: dataguard
    ports:
      - "5433:5432"
    volumes:
      - dataguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard -d dataguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dataguard_pg_data:
